apiVersion: v1 
kind: PersistentVolume 
metadata:
  name: ebs-dynamic
spec:
  accessModes:
    - ReadWriteOnce 
  StorageClassName: roboshop-ebs
  resources:
    requests:
      storage: 4Gi

---
apiVersion: v1 
kind: pod 
metadata: 
  name: app
spec:
  containers:
  - name: nginx 
    image: nginx
    volumeMounts:
    - name: html-data
      mountPath: /usr/share/nginx/html
  # nodeSelector:
  #   topology.kubernetes.io./zone: us-east-1d
  volumes: 
  - name: html-data
    persistentVolumeClaim:
      claimName: ebs-dynamic