apiVersion: v1 
kind: PersistentVolume 
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: "" # sc should be empty for static provisioning
  persistentVolumeReclaimPolicy: Retain 
  csi: 
  driver: efs.csi.aws.com
  volumeHandle: fs-07b1842a76a346c20 # provide file system id

---

apiVersion: v1 
kind: PersistentVolumeClaim 
metadata: 
name: efs-static 
spec: 
  accessModes: 
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests: 
      storage: 5Gi
---
apiVersion: v1 
kind: Pod 
metadata: 
  name: app 
spec: 
  containers: 
  - name: nginx
    image: nginx 
    volumeMounts: 
      - name: html-data
        mountPath: /usr/share/nginx/html
  nodeSelector: 
    topology.kubernetes.io/zone: us-east-1d
  volumes: 
  - name: html-data
    persistentVolumeClaim: 
      claimName: efs-static