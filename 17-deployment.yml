apiVersion: v1
kind: Deployment
metadata:
  name: nginx
  # these labels are replicaset labels
  labels:
    project: roboshop
    purpose: replicaset-demo
    component: frontend
  annotations:
    kubernetes.io/change-cause: "moving to 1.29.7"
spec: 
  replicaset: 3
  selector: 
  # using these labels replica set selects the prod
  matchLabels:
    labels:
    project: roboshop
    purpose: replicaset-demo
    component: frontend
template: 
  metadata:
    labels:
    project: roboshop
    purpose: replicaset-demo
    component: frontend
  spec:
    containers: 
    - name: nginx
      image: nginx:1.29.7
      